:root{

}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:var(--navy);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px;
  padding-top:calc(14px + env(safe-area-inset-top,0px))}
header .bar{height:6px;background:var(--gold);position:absolute;left:0;right:0;top:0}
header h1{font-size:16px;margin:0}
nav{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:2px solid var(--gold);padding:0 8px}
nav button{background:none;border:none;padding:12px 10px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
nav button.active{color:var(--navy);font-weight:bold;border-color:var(--navy)}
main{padding:14px;max-width:900px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--navy)}
label{font-size:12px;color:var(--muted);display:block;margin-top:8px}
input,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;font-size:14px;margin-top:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>div{flex:1;min-width:120px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:normal;font-size:11px;text-transform:uppercase}
tr:hover{background:#f9fafc;cursor:pointer}
.btn{background:var(--navy);color:#fff;border:none;padding:9px 14px;border-radius:6px;font-size:13px;cursor:pointer;margin-top:10px}
.btn.gold{background:var(--gold);color:var(--navy);font-weight:bold}
.btn.ghost{background:none;color:var(--navy);border:1px solid var(--navy)}
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;background:#eef1f8;color:var(--navy)}
.hint{font-size:11px;color:var(--muted);margin-top:4px}
#login{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:50}
#login .box{background:#fff;padding:26px;border-radius:10px;width:280px;text-align:center}
#login .box h2{color:var(--navy);margin-top:0}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.section-title{font-size:11px;text-transform:uppercase;color:var(--gold);font-weight:bold;margin:12px 0 4px}
.printArea{display:none}
@media print{
  body *{visibility:hidden}
  #printArea,#printArea *{visibility:visible}
  #printArea{display:block;position:absolute;top:0;left:0;width:100%}
}
.doc{border:1px solid var(--line);padding:0;font-size:12px}
.doc .top{background:var(--navy);color:#fff;padding:14px;position:relative}
.doc .top .goldbar{position:absolute;bottom:0;left:0;right:0;height:5px;background:var(--gold)}
.doc .body{padding:16px}
.doc table{margin-top:10px}
.sig{margin-top:50px;text-align:center}
.sig .line{border-top:1px solid #333;width:220px;margin:0 auto 4px}
</style>

     <p class="hint" id="msgRecuperar"></p>

<script>
firebase.initializeApp({
  apiKey:"AIzaSyAzl2N0aDNdcDSCs8R9WnA-9IYcyfkqde0", authDomain:"safety-equipamentos.firebaseapp.com",
  projectId:"safety-equipamentos", storageBucket:"safety-equipamentos.firebasestorage.app",
  messagingSenderId:"504587541694", appId:"1:504587541694:web:1812febffa6e00cff892ef"
});
const auth=firebase.auth(), db=firebase.firestore();
let currentUser=null;
function fazerLogin(){
  const email=document.getElementById('u').value.trim(), senha=document.getElementById('p').value;
  const msg=document.getElementById('msgLogin'); msg.textContent='Entrando...';
  auth.signInWithEmailAndPassword(email,senha).then(async cred=>{
    const doc=await db.collection('usuarios').doc(cred.user.uid).get();
    if(!doc.exists){msg.textContent='Login sem cadastro de permissões. Peça ao master pra te registrar na aba Usuários.';auth.signOut();return}
    const d=doc.data();
    if(d.ativo===false){msg.textContent='Acesso desativado. Fale com o administrador.';auth.signOut();return}
    currentUser={uid:cred.user.uid,email:cred.user.email,nome:d.nome||cred.user.email,role:d.role||'comum'};
    document.getElementById('login').style.display='none'; renderNav(); render();
  }).catch(()=>{msg.textContent='E-mail ou senha inválidos.'});
}
function enviarRecuperacao(){
  const email=document.getElementById('eRecuperar').value.trim(); const msg=document.getElementById('msgRecuperar');
  if(!email){msg.textContent='Informe um e-mail.';return}
  auth.sendPasswordResetEmail(email).finally(()=>{msg.textContent='Se este e-mail estiver cadastrado, um link de redefinição foi enviado.'});
}
function sair(){currentUser=null;auth.signOut();document.getElementById('login').style.display='flex';document.getElementById('u').value='';document.getElementById('p').value='';}
</script>

  if(pago>=g.valorTotal)return {label:'PAGO TOTAL',pago,saldo:0};

function novoFuncionario(){
  editandoFId=null;

  document.getElementById('formNovoF').style.display='block';

function editarFuncionario(id){
  editandoFId=id; const f=funcionarios.find(x=>x.id===id);
  document.getElementById('formNovoF').style.display='block';
  nfNome.value=f.nome; nfFuncao.value=f.funcao; nfCpf.value=f.cpf; nfPix.value=f.pix||''; nfBanco.value=f.banco||''; nfTel.value=f.tel||''; nfEndereco.value=f.endereco||'';
}
function salvarFuncionario(){
  const nome=nfNome.value.trim(); if(!nome){return}
  const dados={nome,funcao:nfFuncao.value||'-',cpf:nfCpf.value||'-',pix:nfPix.value||'',banco:nfBanco.value||'',tel:nfTel.value||'',endereco:nfEndereco.value||''};

  document.getElementById('formNovoF').style.display='none';
  render(); filtroF('');
}
function filtroF(q){
  q=q.toLowerCase();
  const list=funcionarios.filter(f=>f.nome.toLowerCase().includes(q)||f.cpf.includes(q)||f.id.toLowerCase().includes(q));
  document.getElementById('tbF').innerHTML=list.map(f=>
   `<tr><td onclick="abrirF('${f.id}')" style="cursor:pointer">${f.id}</td><td onclick="abrirF('${f.id}')" style="cursor:pointer">${f.nome}</td><td>${f.cpf}</td><td>${f.funcao}</td><td><button class="btn ghost" style="margin:0;padding:3px 8px" onclick="editarFuncionario('${f.id}')">editar</button></td></tr>`).join('');
}
setTimeout(()=>filtroF(''),0);
function totaisPorFuncionario(fid){
  let tot={cafe:0,almoco:0,lanche:0,janta:0,passagem:0,combustivel:0,estac:0,hosp:0,diaria:0};
  lancamentos.forEach(l=>{
    if(l.colabs.includes(fid)){
      const n=l.colabs.length;
      tot.cafe+=l.alim.cafe/n; tot.almoco+=l.alim.almoco/n; tot.lanche+=l.alim.lanche/n; tot.janta+=l.alim.janta/n;
      tot.passagem+=l.log.passagem/n; tot.combustivel+=l.log.combustivel/n; tot.estac+=l.log.estac/n; tot.hosp+=l.log.hosp/n;
      tot.diaria+=(l.diaria[fid]||0);
    }
  });
  return tot;
}
function abrirF(fid){
  const f=funcionarios.find(x=>x.id===fid);
  const t=totaisPorFuncionario(fid);

    <h2>${f.nome} <span class="tag">${f.id}</span></h2>

    <tr><td>Logística</td><td>R$ ${(t.passagem+t.combustivel+t.estac+t.hosp).toFixed(2)}</td></tr>
    <tr><td>Diária</td><td>R$ ${t.diaria.toFixed(2)}</td></tr>
    <tr><td><b>Total</b></td><td><b>R$ ${total.toFixed(2)}</b></td></tr></table>
    <button class="btn" onclick="gerarRecibo('${fid}',['diaria','alim','log'])">Gerar recibo (PDF)</button>
   </div>`;
}

function addRespRow(r){
  const d=document.createElement('div'); d.className='row respRow';
  d.innerHTML=`<div><label>Nome</label><input class="rNome" value="${r?.nome||''}"></div><div><label>Função</label><input class="rFuncao" value="${r?.funcao||''}"></div>
   <div><label>Telefone</label><input class="rTel" value="${r?.tel||''}"></div><div><label>E-mail</label><input class="rEmail" value="${r?.email||''}"></div>`;
  document.getElementById('respRows').appendChild(d);
}
function toggleNovoO(){const d=document.getElementById('formNovoO');d.style.display=d.style.display==='none'?'block':'none';if(!document.getElementById('respRows').children.length)addRespRow();}
function novaObra(){
  editandoObraId=null;
  ['noNome','noValor','noEndereco','noCnpj','noDesc','noOS','noContrato','noCno','noEnderecoObra','noEnderecoObraInd','noEmbarcacao','noImo','noLocal'].forEach(id=>document.getElementById(id).value='');
  noTipo.value='Fechada'; noSeg.value='Civil'; toggleSegForm();
  document.getElementById('respRows').innerHTML=''; addRespRow();
  document.getElementById('formNovoO').style.display='block';
}
function editarObra(id){
  editandoObraId=id; const o=obras.find(x=>x.id===id);
  document.getElementById('formNovoO').style.display='block';
  noNome.value=o.nome; noTipo.value=o.tipo; noSeg.value=o.segmento||'Civil'; noValor.value=o.valor||'';
  noEndereco.value=o.endereco||''; noCnpj.value=o.cnpj||''; noDesc.value=o.descricaoServico||'';
  noOS.value=o.numOS||''; noContrato.value=o.numContrato||'';
  noCno.value=o.cno||''; noEnderecoObra.value=o.enderecoObra||''; noEnderecoObraInd.value=o.enderecoObra||'';
  noEmbarcacao.value=o.embarcacao||''; noImo.value=o.imo||''; noLocal.value=o.localizacaoAtual||'';
  toggleSegForm();
  document.getElementById('respRows').innerHTML='';
  (o.responsaveis&&o.responsaveis.length?o.responsaveis:[{}]).forEach(addRespRow);
}
function salvarObra(){
  const nome=noNome.value.trim(); if(!nome){return}
  const responsaveis=[...document.querySelectorAll('.respRow')].map(r=>({
   nome:r.querySelector('.rNome').value, funcao:r.querySelector('.rFuncao').value,
   tel:r.querySelector('.rTel').value, email:r.querySelector('.rEmail').value})).filter(r=>r.nome);
  const base={nome,endereco:noEndereco.value||'',cnpj:noCnpj.value||'',segmento:noSeg.value,
   descricaoServico:noDesc.value||'',numOS:noOS.value||'',numContrato:noContrato.value||'',
   responsaveis,tipo:noTipo.value,valor:noTipo.value==='Fechada'?num(noValor.value):null};
  if(noSeg.value==='Civil') Object.assign(base,{cno:noCno.value||'',enderecoObra:noEnderecoObra.value||''});
  if(noSeg.value==='Industrial') Object.assign(base,{enderecoObra:noEnderecoObraInd.value||''});
  if(noSeg.value==='Maritimo') Object.assign(base,{embarcacao:noEmbarcacao.value||'',imo:noImo.value||'',localizacaoAtual:noLocal.value||''});
  if(editandoObraId){
    const o=obras.find(x=>x.id===editandoObraId);
    if(noSeg.value==='Maritimo'&&!o.historicoLocalizacao)base.historicoLocalizacao=noLocal.value?[{data:new Date().toISOString().slice(0,10),local:noLocal.value}]:[];
    else if(noSeg.value==='Maritimo')base.historicoLocalizacao=o.historicoLocalizacao;
    Object.assign(o,base); editandoObraId=null;
  } else {
    base.id='O'+String(obras.length+1).padStart(3,'0'); base.pagamentos=[];
    if(noSeg.value==='Maritimo')base.historicoLocalizacao=noLocal.value?[{data:new Date().toISOString().slice(0,10),local:noLocal.value}]:[];
    obras.push(base);
  }
  toggleNovoO(); render(); filtroO('');
}
function atualizarLocalizacao(id){
  const novo=prompt('Nova localização (porto, estaleiro ou área de fundeio):'); if(!novo)return;
  const o=obras.find(x=>x.id===id);
  o.localizacaoAtual=novo; o.historicoLocalizacao.push({data:new Date().toISOString().slice(0,10),local:novo});
  render();
}
function verHistoricoLocal(id){
  const o=obras.find(x=>x.id===id);
  document.getElementById('painelLocal').innerHTML=`<div class="card"><h2>${o.nome} — histórico de localização</h2>
   <table><thead><tr><th>Data</th><th>Local</th></tr></thead>
   <tbody>${o.historicoLocalizacao.map(h=>`<tr><td>${h.data}</td><td>${h.local}</td></tr>`).join('')}</tbody></table></div>`;
}
function filtroO(q){
  q=q.toLowerCase();
  const list=obras.filter(o=>[o.nome,o.cnpj,o.cno,o.imo,o.embarcacao,o.numOS,o.numContrato,o.id,...(o.responsaveis||[]).map(r=>r.nome)].join(' ').toLowerCase().includes(q));
  document.getElementById('tbO').innerHTML=list.map(o=>{
   const resp=(o.responsaveis||[]).map(r=>`${r.nome}${r.funcao?' ('+r.funcao+')':''}`).join('; ')||'-';
   let seg=o.segmento==='Maritimo'?'Marítimo':(o.segmento||o.tipo);
   let osct=`${o.numOS||'-'}<br>${o.numContrato||''}`;
   if(o.segmento==='Maritimo') osct+=`<br><span class="hint">${o.embarcacao||''} · ${o.imo||''} · ${o.localizacaoAtual||''}</span> <button class="btn ghost" style="margin:2px 2px 0;padding:3px 8px" onclick="event.stopPropagation();atualizarLocalizacao('${o.id}')">atualizar local</button><button class="btn ghost" style="margin:2px 0 0;padding:3px 8px" onclick="event.stopPropagation();verHistoricoLocal('${o.id}')">histórico</button>`;
   if(o.tipo==='Fechada'){const pago=(o.pagamentos||[]).reduce((s,p)=>s+p.valor,0);
    osct+=`<br><span class="hint">Recebido R$ ${pago.toFixed(2)} / Saldo R$ ${(o.valor-pago).toFixed(2)}</span> <button class="btn ghost" style="margin:2px 0 0;padding:3px 8px" onclick="event.stopPropagation();registrarPagamentoObra('${o.id}')">+ medição</button>`;}
   return `<tr><td>${o.id}</td><td onclick="editarObra('${o.id}')" style="cursor:pointer">${o.nome}</td><td><span class="tag">${seg}</span></td><td>${osct}</td><td>${resp}</td><td><button class="btn ghost" style="margin:0;padding:3px 8px" onclick="editarObra('${o.id}')">editar</button></td></tr>`}).join('');
}
setTimeout(()=>{if(active==='Obras')filtroO('')},0);

function num(v){return v===''||v===null||v===undefined?0:parseFloat(v)}

  const ids=[...document.querySelectorAll('.cColab:checked')].map(c=>c.value);

  </div><div id="painelAtend"></div>`;

function abrirAtendimento(oid){
  const c=obras.find(o=>o.id===oid);
  const lista=faturamentos.filter(f=>f.obra===oid && f.data.startsWith(String(anoAtual)));
  const total=lista.reduce((s,f)=>s+f.valor,0);
  document.getElementById('painelAtend').innerHTML=`<div class="card">
   <h2>${c.nome} — lançar valor do dia</h2>
   <div class="row"><div><label>Data</label><input type="date" id="fData" value="2026-09-27"></div>
   <div><label>Valor faturado no dia</label><input type="number" id="fValor" placeholder="ex: 2000"></div></div>
   <button class="btn gold" onclick="salvarFaturamento('${oid}')">Adicionar</button>
   <table style="margin-top:10px"><thead><tr><th>Data</th><th>Valor</th></tr></thead>
   <tbody>${lista.map(f=>`<tr><td>${f.data}</td><td>R$ ${f.valor.toFixed(2)}</td></tr>`).join('')}
   <tr><td><b>TOTAL DO FECHAMENTO (${anoAtual})</b></td><td><b>R$ ${total.toFixed(2)}</b></td></tr></tbody></table>
  </div>`;
}
function salvarFaturamento(oid){
  const v=num(document.getElementById('fValor').value); if(!v)return;
  faturamentos.push({obra:oid,data:document.getElementById('fData').value,valor:v});
  abrirAtendimento(oid);
}

function viewUsuarios(){
  setTimeout(carregarUsuarios,0);
  return `<div class="card"><h2>Usuários do sistema</h2>
   <p class="hint">1) Crie o login em Firebase Console → Authentication → Add user (e-mail/senha). 2) Copie o UID gerado e registre aqui com o papel da pessoa.</p>
   <div class="row"><div><label>UID (do Firebase Authentication)</label><input id="nuUid"></div>
   <div><label>Nome</label><input id="nuNome"></div></div>
   <div class="row"><div><label>Papel</label><select id="nuRole"><option value="comum">Comum</option><option value="master">Master</option></select></div></div>
   <button class="btn gold" onclick="salvarUsuario()">Registrar usuário</button>
  </div>
  <div class="card"><h2>Usuários cadastrados</h2><table id="tbUsuarios"><tr><td>Carregando...</td></tr></table></div>`;
}
async function carregarUsuarios(){
  const snap=await db.collection('usuarios').get();
  const tb=document.getElementById('tbUsuarios'); if(!tb)return;
  tb.innerHTML='<tr><th>ID</th><th>Nome</th><th>Papel</th><th>Status</th><th></th></tr>'+
   snap.docs.map(d=>{const u=d.data();return `<tr><td>${d.id.slice(0,6)}</td><td>${u.nome}</td><td>${u.role}</td><td><span class="tag">${u.ativo===false?'DESATIVADO':'ATIVO'}</span></td><td><button class="btn ghost" style="margin:0;padding:3px 8px" onclick="toggleUsuario('${d.id}',${u.ativo===false})">${u.ativo===false?'reativar':'desativar'}</button></td></tr>`}).join('');
}
function salvarUsuario(){
  const uid=nuUid.value.trim(); if(!uid)return;
  db.collection('usuarios').doc(uid).set({nome:nuNome.value||'-',role:nuRole.value,ativo:true}).then(carregarUsuarios);
}
function toggleUsuario(uid,ativar){
  db.collection('usuarios').doc(uid).update({ativo:ativar}).then(carregarUsuarios);
}

function catsSelecionadas(){

  return c;
}
function gerarReciboUI(){gerarRecibo(document.getElementById('rFunc').value,catsSelecionadas())}
function gerarRecibo(fid,cats){
  const f=funcionarios.find(x=>x.id===fid); const t=totaisPorFuncionario(fid);
  let rows='';
  if(cats.includes('alim'))rows+=`<tr><td>Alimentação (café/almoço/lanche/janta)</td><td>R$ ${(t.cafe+t.almoco+t.lanche+t.janta).toFixed(2)}</td></tr>`;
  if(cats.includes('log'))rows+=`<tr><td>Logística (passagem/combustível/estac./hospedagem)</td><td>R$ ${(t.passagem+t.combustivel+t.estac+t.hosp).toFixed(2)}</td></tr>`;
  if(cats.includes('diaria'))rows+=`<tr><td>Diária</td><td>R$ ${t.diaria.toFixed(2)}</td></tr>`;
  document.getElementById('printArea').innerHTML=`<div class="doc">
   <div class="top"><b>SAFETY EQUIPAMENTOS</b><br><span style="font-size:10px">CNPJ 22.015.773/0001-84 · Rua José de Queiroz, 196 - Bento Ribeiro - RJ</span><div class="goldbar"></div></div>
   <div class="body"><h3>RECIBO DE PAGAMENTO</h3>
   <p>Nome: ${f.nome}<br>CPF: ${f.cpf}<br>Função: ${f.funcao}<br>Período: Setembro/2026</p>
   <table>${rows}</table>
   <div class="sig"><div class="line"></div>${f.nome}</div>
   <p class="hint" style="margin-top:20px">Emitido por: ${currentUser?currentUser.nome+' (ID '+currentUser.uid.slice(0,6)+')':'-'} em ${new Date().toLocaleString('pt-BR')}</p></div></div>`;
  window.print();
}
function gerarAuditoria(){
  let ta=0,tl=0,td=0;
  let rows=funcionarios.map(f=>{const t=totaisPorFuncionario(f.id);
   const a=t.cafe+t.almoco+t.lanche+t.janta, l=t.passagem+t.combustivel+t.estac+t.hosp;
   ta+=a; tl+=l; td+=t.diaria;
   return `<tr><td>${f.nome}</td><td>R$ ${a.toFixed(2)}</td><td>R$ ${l.toFixed(2)}</td><td>R$ ${t.diaria.toFixed(2)}</td></tr>`}).join('');
  rows+=`<tr><td><b>TOTAL GERAL</b></td><td><b>R$ ${ta.toFixed(2)}</b></td><td><b>R$ ${tl.toFixed(2)}</b></td><td><b>R$ ${td.toFixed(2)}</b></td></tr>`;
  document.getElementById('printArea').innerHTML=`<div class="doc">
   <div class="top"><b>SAFETY EQUIPAMENTOS</b><br><span style="font-size:10px">Documento de auditoria interna</span><div class="goldbar"></div></div>
   <div class="body"><h3>RELATÓRIO DE AUDITORIA - Setembro/2026</h3>
   <table><tr><th>Funcionário</th><th>Alimentação</th><th>Logística</th><th>Diária</th></tr>${rows}</table>
   <p class="hint" style="margin-top:20px">Emitido por: ${currentUser?currentUser.nome+' (ID '+currentUser.uid.slice(0,6)+')':'-'} em ${new Date().toLocaleString('pt-BR')}</p></div></div>`;
  window.print();
}

// ---------- Dashboard ----------
function viewDashboard(){
  const rows=obras.filter(o=>o.tipo==='Fechada').map(o=>{
   const gastoLanc=lancamentos.filter(l=>l.obra===o.id && l.data.startsWith(String(anoAtual))).reduce((s,l)=>s+l.alim.cafe+l.alim.almoco+l.alim.lanche+l.alim.janta+l.log.passagem+l.log.combustivel+l.log.estac+l.log.hosp+Object.values(l.diaria).reduce((a,b)=>a+b,0),0);
   const gastoIndireto=gastosIndiretos.filter(g=>g.obra===o.id && g.data.startsWith(String(anoAtual))).reduce((s,g)=>s+g.valorTotal,0);
   const gasto=gastoLanc+gastoIndireto;
   return {...o,gasto,resultado:o.valor-gasto};
  });
  const tv=rows.reduce((s,r)=>s+r.valor,0), tg=rows.reduce((s,r)=>s+r.gasto,0), tr=rows.reduce((s,r)=>s+r.resultado,0);
  return `<div class="card"><h2>Dashboard — Resultado do período (${anoAtual})</h2>
   <p class="hint">Não representa o saldo real de caixa (há retiradas de sócios não contabilizadas aqui) — uso para balanço anual e projeção de meta. Gasto inclui lançamentos + gastos indiretos.</p>
   <table><thead><tr><th>Obra</th><th>Valor</th><th>Gasto</th><th>Resultado</th></tr></thead>
   <tbody>${rows.map(r=>`<tr><td>${r.nome}</td><td>R$ ${r.valor}</td><td>R$ ${r.gasto.toFixed(2)}</td><td>R$ ${r.resultado.toFixed(2)}</td></tr>`).join('')}
   <tr><td><b>TOTAL</b></td><td><b>R$ ${tv}</b></td><td><b>R$ ${tg.toFixed(2)}</b></td><td><b>R$ ${tr.toFixed(2)}</b></td></tr></tbody></table>
  </div>`;
}
