<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<style>
:root{
  --navy:#1b2f5e; --gold:#c9a227; --bg:#f4f6fa; --card:#fff; --text:#1c2333; --muted:#6b7280; --line:#e2e6ee;
}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--text);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{background:var(--navy);color:#fff;padding:14px 18px;display:flex;align-items:center;gap:10px;
  padding-top:calc(14px + env(safe-area-inset-top,0px))}
header .bar{height:6px;background:var(--gold);position:absolute;left:0;right:0;top:0}
header h1{font-size:16px;margin:0}
header .brand{display:flex;align-items:center;gap:9px;min-width:0}
header .brand img{height:34px;width:auto;object-fit:contain;flex:0 0 auto}
#loginLogo{height:82px;width:auto;max-width:190px;object-fit:contain;margin:0 auto 10px;display:block}
.table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:12px 0}
.kpi{border:1px solid var(--line);border-radius:8px;padding:12px;background:#fff}.kpi .v{font-size:20px;font-weight:bold;color:var(--navy);margin-top:4px}.kpi .l{font-size:11px;color:var(--muted);text-transform:uppercase}
.chartBox{height:260px;position:relative;margin-top:12px}.chartBox canvas{width:100%;height:100%}
@media(max-width:650px){.card{overflow-x:auto}header{padding-left:12px;padding-right:10px;flex-wrap:wrap}header .brand{width:100%}header .brand img{height:29px}header h1{font-size:13px}header #userTag{margin-left:0!important;flex:1}header #anoSel{margin-left:0!important}.kpis{grid-template-columns:1fr 1fr}.kpi .v{font-size:16px}main{padding:10px}.card{padding:11px}table{min-width:560px}.table-wrap table{min-width:680px}#login .box{width:min(310px,calc(100vw - 28px));padding:22px}}
nav{display:flex;gap:4px;overflow-x:auto;background:#fff;border-bottom:2px solid var(--gold);padding:0 8px}
nav button{background:none;border:none;padding:12px 10px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent}
nav button.active{color:var(--navy);font-weight:bold;border-color:var(--navy)}
main{padding:14px;max-width:900px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:14px}
.card h2{font-size:15px;margin:0 0 10px;color:var(--navy)}
label{font-size:12px;color:var(--muted);display:block;margin-top:8px}
input,select{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;font-size:14px;margin-top:2px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>div{flex:1;min-width:120px}
table{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:normal;font-size:11px;text-transform:uppercase}
tr:hover{background:#f9fafc;cursor:pointer}
.btn{background:var(--navy);color:#fff;border:none;padding:9px 14px;border-radius:6px;font-size:13px;cursor:pointer;margin-top:10px}
.btn.gold{background:var(--gold);color:var(--navy);font-weight:bold}
.btn.ghost{background:none;color:var(--navy);border:1px solid var(--navy)}
.tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:10px;background:#eef1f8;color:var(--navy)}
.hint{font-size:11px;color:var(--muted);margin-top:4px}
#login{position:fixed;inset:0;background:var(--navy);display:flex;align-items:center;justify-content:center;z-index:50}
#login .box{background:#fff;padding:26px;border-radius:10px;width:280px;text-align:center}
#login .box h2{color:var(--navy);margin-top:0}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;margin-top:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.section-title{font-size:11px;text-transform:uppercase;color:var(--gold);font-weight:bold;margin:12px 0 4px}
.printArea{display:none}
@page{size:A4;margin:10mm 12mm 14mm 12mm;@bottom-right{content:"PÁG. " counter(page);font:bold 8pt Arial,sans-serif;color:#6b7280}}
@media print{
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
#printArea{font-family:Arial,Helvetica,sans-serif;color:#0b2a4a;font-size:10pt}
#printArea table.pg{width:100%;border-collapse:collapse;height:258mm}
#printArea table.pg>thead>tr>td,#printArea table.pg>tbody>tr>td,#printArea table.pg>tfoot>tr>td{padding:0;border:0}
#printArea table.pg>thead,#printArea table.pg>tfoot{display:table-header-group}
#printArea table.pg>tfoot{display:table-footer-group}
.tb{width:100%;border-collapse:collapse;margin:3mm 0;font-size:8.5pt}
.tb th{background:#e8eef7;color:#0b2a4a;text-align:left;padding:5px 6px;font-size:7.5pt;text-transform:uppercase}
.tb td{padding:4px 6px;border-bottom:1px solid #d9e0ec}
.tb .r{text-align:right}
.tb tr.grp td{font-weight:bold;color:#0f4c9c;background:#f7f9fd}
.tb tr.sub td{background:#f7f9fd;font-size:8pt}
.tb tr.tot td{font-weight:bold;background:#eef3fa;border-top:2px solid #0b2a4a}
.tb tr{page-break-inside:avoid}
.doc{border:1px solid var(--line);padding:0;font-size:12px}
.doc .top{background:var(--navy);color:#fff;padding:14px;position:relative}
.doc .top .goldbar{position:absolute;bottom:0;left:0;right:0;height:5px;background:var(--gold)}
.doc .body{padding:16px}
.doc table{margin-top:10px}
.sig{margin-top:50px;text-align:center}
.sig .line{border-top:1px solid #333;width:220px;margin:0 auto 4px}
</style>

<body>

<div id="login">
  <div class="box">
    <img id="loginLogo" alt="Safety Equipamentos">
    <h2>Safety Equipamentos</h2>
    <p class="hint">Acesso restrito - usuário autorizado</p>
    <div id="telaLogin">
     <label>E-mail</label><input id="u" placeholder="seu@email.com">
     <label>Senha</label><input id="p" type="password" placeholder="senha">
     <button class="btn gold" style="width:100%" onclick="fazerLogin()">Entrar</button>
     <p class="hint" id="msgLogin"></p>
     <p class="hint" style="cursor:pointer;text-decoration:underline" onclick="document.getElementById('telaLogin').style.display='none';document.getElementById('telaRecuperar').style.display='block'">Esqueci minha senha</p>
    </div>
    <div id="telaRecuperar" style="display:none">
     <label>Informe seu e-mail cadastrado</label><input id="eRecuperar" placeholder="seu@email.com">
     <button class="btn gold" style="width:100%" onclick="enviarRecuperacao()">Enviar link de recuperação</button>
     <p class="hint" id="msgRecuperar"></p>
     <p class="hint" style="cursor:pointer;text-decoration:underline" onclick="document.getElementById('telaRecuperar').style.display='none';document.getElementById('telaLogin').style.display='block'">Voltar ao login</p>
    </div>
  </div>
</div>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyAzl2N0aDNdcDSCs8R9WnA-9IYcyfkqde0", authDomain:"safety-equipamentos.firebaseapp.com",
  projectId:"safety-equipamentos", storageBucket:"safety-equipamentos.firebasestorage.app",
  messagingSenderId:"504587541694", appId:"1:504587541694:web:1812febffa6e00cff892ef"
});
const auth=firebase.auth(), db=firebase.firestore();
let currentUser=null;
function fazerLogin(){
  const email=document.getElementById('u').value.trim(), senha=document.getElementById('p').value;
  const msg=document.getElementById('msgLogin'); msg.textContent='Entrando...';
  auth.signInWithEmailAndPassword(email,senha).then(async cred=>{
    const doc=await db.collection('usuarios').doc(cred.user.uid).get();
    if(!doc.exists){msg.textContent='Login sem cadastro de permissões. Peça ao master pra te registrar na aba Usuários.';auth.signOut();return}
    const d=doc.data();
    if(d.ativo===false){msg.textContent='Acesso desativado. Fale com o administrador.';auth.signOut();return}
    const nomeUsuario=d.nome||cred.user.email;
    let role=d.role||'colaborador'; if(role==='comum')role='colaborador';
    const bootstrapAdmin=/^jadiel\s+pires$/i.test(nomeUsuario.trim());
    currentUser={uid:cred.user.uid,email:cred.user.email,nome:nomeUsuario,role,funcionarioId:d.funcionarioId||null,gerenciarUsuarios:d.gerenciarUsuarios===true||bootstrapAdmin};
    if(bootstrapAdmin&&d.gerenciarUsuarios!==true) await db.collection('usuarios').doc(cred.user.uid).update({gerenciarUsuarios:true});
    msg.textContent='Carregando dados...'; await carregarDados(); document.getElementById('login').style.display='none'; renderNav(); render();
  }).catch(()=>{msg.textContent='E-mail ou senha inválidos.'});
}
function enviarRecuperacao(){
  const email=document.getElementById('eRecuperar').value.trim(); const msg=document.getElementById('msgRecuperar');
  if(!email){msg.textContent='Informe um e-mail.';return}
  auth.sendPasswordResetEmail(email).finally(()=>{msg.textContent='Se este e-mail estiver cadastrado, um link de redefinição foi enviado.'});
}
function persistir(colecao,item,acao,antes){
  const agora=new Date().toISOString(), novo=!item.criadoPor;
  if(!item.id) item.id=db.collection(colecao).doc().id;
  if(novo){item.criadoPor=currentUser.uid;item.criadoEm=agora;}
  item.alteradoPor=currentUser.uid; item.alteradoEm=agora;
  db.collection('auditoria').add({colecao,itemId:item.id,acao:acao||(novo?'criado':'alterado'),uid:currentUser.uid,nome:currentUser.nome,em:agora,...(antes?{antes:JSON.stringify(antes)}:{})});
  return db.collection(colecao).doc(item.id).set(JSON.parse(JSON.stringify(item))).catch(e=>alert('Erro ao salvar: '+e.message));
}
async function carregarDados(){
  try{
    const ler=async(c,arr)=>{const snap=await db.collection(c).get();arr.length=0;snap.docs.forEach(d=>arr.push({...d.data(),id:d.id}))};
    const role=currentUser?.role||'colaborador';
    if(role==='master'||role==='gestor'){
      if(role==='gestor'){
        await Promise.all([ler('funcionarios',funcionarios),ler('obras',obras),ler('escalas',escalas)]);
        lancamentos.length=0; gastosIndiretos.length=0; faturamentos.length=0;
      } else {
        await Promise.all([ler('funcionarios',funcionarios),ler('obras',obras),ler('escalas',escalas),ler('lancamentos',lancamentos),ler('gastos',gastosIndiretos),ler('faturamentos',faturamentos)]);
      }
    } else {
      // Colaborador recebe somente documentos de escala que contêm seu ID. Não baixa cadastros gerais.
      funcionarios.length=0; obras.length=0; lancamentos.length=0; gastosIndiretos.length=0; faturamentos.length=0; escalas.length=0;
      if(currentUser.funcionarioId){const snap=await db.collection('escalas').where('colabs','array-contains',currentUser.funcionarioId).get();snap.docs.forEach(d=>escalas.push({...d.data(),id:d.id}));}
    }
    const porId=(a,b)=>a.id.localeCompare(b.id), porData=(a,b)=>(a.data||'').localeCompare(b.data||'');
    funcionarios.sort(porId); obras.sort(porId); escalas.sort(porData); lancamentos.sort(porData); gastosIndiretos.sort(porData);
    if(role==='master'&&!obras.some(o=>o.tipo==='Administrativo')){const adm={id:'ADM',nome:'ADMINISTRATIVO',endereco:'',cnpj:'',segmento:'',tipo:'Administrativo',valor:null,responsaveis:[]};obras.push(adm);await persistir('obras',adm);}
     atualizarAnos();
  }catch(e){alert('Erro ao carregar dados: '+e.message)}
}

function sair(){currentUser=null;auth.signOut();document.getElementById('login').style.display='flex';document.getElementById('u').value='';document.getElementById('p').value='';}
</script>

<div class="bar" style="height:6px;background:var(--gold)"></div>
<header><div class="brand"><img id="headerLogo" alt="Safety Equipamentos"><h1>SAFETY EQUIPAMENTOS · Sistema Interno</h1></div>
 <span id="userTag" class="hint" style="color:#fff;margin-left:10px"></span>
 <select id="anoSel" style="width:auto;margin:0 0 0 auto;background:#fff" onchange="anoAtual=parseInt(this.value);render()">
  
 </select>
 <button class="btn ghost" style="margin:0 0 0 8px;background:#fff" onclick="sair()">Sair</button>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<div id="printArea" class="printArea"></div>

<script>
// ---------- dados de exemplo ----------
const funcionarios=[];
const obras=[];
let lancamentos=[];
let atendimentos=[];
let gastosIndiretos=[];
const categoriasGasto=['Obra Direto (Material)','Obra Direto (Visita Técnica)','Impostos/Encargos','RH/Pessoal (Curso/Treinamento/ASO)','Fixo/Adm'];
let faturamentos=[];
let escalas=[];
let anoAtual=new Date().getFullYear();
function anosDisponiveis(){
  const ys=new Set([new Date().getFullYear()]);
  const add=d=>{const y=parseInt(String(d||'').slice(0,4));if(y>=2000&&y<=2100)ys.add(y)};
  lancamentos.forEach(x=>add(x.data)); gastosIndiretos.forEach(x=>add(x.data)); faturamentos.forEach(x=>add(x.data)); escalas.forEach(x=>add(x.data));
  obras.forEach(o=>(o.pagamentos||[]).forEach(p=>add(p.data)));
  return [...ys].sort((a,b)=>b-a);
}
function atualizarAnos(){const sel=document.getElementById('anoSel');if(!sel)return;const ys=anosDisponiveis();if(!ys.includes(anoAtual))anoAtual=ys[0];sel.innerHTML=ys.map(a=>`<option value="${a}" ${a===anoAtual?'selected':''}>Ano ${a}</option>`).join('');}
atualizarAnos();
const MESES=['Ano todo','Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
function periodoLabel(mes){return mes?MESES[mes]+'/'+anoAtual:'Ano '+anoAtual}
function noPeriodo(data,mes){return (data||'').startsWith(String(anoAtual))&&(!mes||data.slice(5,7)===String(mes).padStart(2,'0'))}
function opcoesMes(sel){return MESES.map((m,i)=>`<option value="${i}" ${i===sel?'selected':''}>${m}</option>`).join('')}
const hoje=()=>new Date().toLocaleDateString('sv-SE');
function statusGasto(g){
  const pago=g.pagamentos.reduce((s,p)=>s+p.valor,0);
  if(pago<=0)return {label:'PENDENTE',pago,saldo:g.valorTotal};
  if(pago>=g.valorTotal)return {label:'PAGO TOTAL',pago,saldo:0};
  return {label:'PAGO PARCIAL',pago,saldo:g.valorTotal-pago};
}
function registrarPagamentoGasto(i){
  const v=parseFloat(prompt('Valor da parcela paga agora:')); if(!v)return;
  const st=statusGasto(gastosIndiretos[i]); if(v>st.saldo)return alert('A parcela não pode ser maior que o saldo de '+brl(st.saldo)+'.');
  gastosIndiretos[i].pagamentos.push({data:new Date().toISOString().slice(0,10),valor:v}); persistir('gastos',gastosIndiretos[i]);
  render();
}
function registrarPagamentoObra(id){
  const o=obras.find(x=>x.id===id); if(!o)return;
  const recebido=(o.pagamentos||[]).reduce((s,p)=>s+num(p.valor),0);
  const saldo=Math.max(0,num(o.valor)-recebido);
  if(saldo<=0)return alert('Esta obra já está totalmente recebida. Não há saldo disponível para nova medição.');
  const entrada=prompt('Valor recebido nesta medição:'); if(entrada===null)return;
  const v=parseFloat(String(entrada).replace(',','.'));
  if(!(v>0))return alert('Informe um valor de medição maior que zero.');
  if(v>saldo)return alert('A medição não pode ser maior que o saldo da obra de '+brl(saldo)+'.');
  o.pagamentos=o.pagamentos||[];
  o.pagamentos.push({data:new Date().toISOString().slice(0,10),valor:v});
  persistir('obras',o);
  render();
}

const tabsMaster=['Funcionários','Obras','Escalas','Lançamentos','Atendimentos','Gastos Indiretos','Recibos','Dashboard'];
const tabsGestor=['Escalas'];
const tabsColaborador=['Minha Escala','Meu Histórico'];
let active='Funcionários';
function tabsVisiveis(){
  if(!currentUser)return [];
  const pessoais=currentUser.funcionarioId?[...tabsColaborador]:[];
  if(currentUser.role==='master')return currentUser.gerenciarUsuarios?[...tabsMaster,...pessoais,'Usuários']:[...tabsMaster,...pessoais];
  if(currentUser.role==='gestor')return [...tabsGestor,...pessoais];
  return tabsColaborador;
}
function nomeF(id){return funcionarios.find(f=>f.id===id)?.nome||id}
function nomeO(id){return obras.find(o=>o.id===id)?.nome||id}

function renderNav(){
  const tv=tabsVisiveis(); if(tv.length&&!tv.includes(active))active=tv[0];
  document.getElementById('nav').innerHTML=tv.map(t=>
   `<button class="${t===active?'active':''}" onclick="setTab('${t}')">${t}</button>`).join('');
  if(currentUser)document.getElementById('userTag').textContent=`${currentUser.nome} (${currentUser.role})`;
}
function setTab(t){active=t;renderNav();render()}

function render(){
  const m=document.getElementById('main');
  if(active==='Funcionários') m.innerHTML=viewFuncionarios();
  if(active==='Obras') m.innerHTML=viewObras();
  if(active==='Escalas') m.innerHTML=viewEscalas();
  if(active==='Minha Escala') m.innerHTML=viewMinhaEscala();
  if(active==='Meu Histórico') m.innerHTML=viewMeuHistorico();
  if(active==='Lançamentos') m.innerHTML=viewLancamentos();
  if(active==='Atendimentos') m.innerHTML=viewAtendimentos();
  if(active==='Gastos Indiretos') m.innerHTML=viewGastos();
  if(active==='Recibos') m.innerHTML=viewRecibos();
  if(active==='Dashboard') m.innerHTML=viewDashboard();
  if(active==='Usuários') m.innerHTML=currentUser?.gerenciarUsuarios?viewUsuarios():'<div class="card"><h2>Acesso restrito</h2><p>Somente o administrador de usuários pode acessar esta página.</p></div>';
  if(active==='Funcionários')filtroF('');
  if(active==='Obras')filtroO('');
  if(active==='Lançamentos'){renderColabs();renderDiarias();renderListaLanc();}
}

// ---------- Funcionários ----------
let editandoFId=null;
function viewFuncionarios(){
  return `<div class="card">
    <h2>Buscar funcionário</h2>
    <input placeholder="Nome, CPF ou ID" oninput="filtroF(this.value)">
    <table><thead><tr><th>ID</th><th>Nome</th><th>CPF</th><th>Função</th><th></th></tr></thead>
    <tbody id="tbF"></tbody></table>
    <button class="btn ghost" onclick="novoFuncionario()">+ Novo colaborador</button>
    <div id="formNovoF" style="display:none;margin-top:10px">
     <div class="row"><div><label>Nome</label><input id="nfNome"></div>
     <div><label>Função</label><input id="nfFuncao"></div></div>
     <div class="row"><div><label>CPF</label><input id="nfCpf" placeholder="000.000.000-00"></div>
     <div><label>PIX</label><input id="nfPix"></div></div>
     <div class="row"><div><label>Banco</label><input id="nfBanco"></div>
     <div><label>Telefone</label><input id="nfTel"></div></div>
     <div class="row"><div><label>Endereço</label><input id="nfEndereco"></div></div>
     <button class="btn gold" onclick="salvarFuncionario()">Salvar colaborador</button>
    </div>
  </div>
  <div id="relF"></div>`;
}
function toggleNovoF(){const d=document.getElementById('formNovoF');d.style.display=d.style.display==='none'?'block':'none'}
function novoFuncionario(){
  editandoFId=null;
  ['nfNome','nfFuncao','nfCpf','nfPix','nfBanco','nfTel','nfEndereco'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('formNovoF').style.display='block';
}
function editarFuncionario(id){
  editandoFId=id; const f=funcionarios.find(x=>x.id===id);
  document.getElementById('formNovoF').style.display='block';
  nfNome.value=f.nome; nfFuncao.value=f.funcao; nfCpf.value=f.cpf; nfPix.value=f.pix||''; nfBanco.value=f.banco||''; nfTel.value=f.tel||''; nfEndereco.value=f.endereco||'';
}
function salvarFuncionario(){
  const nome=nfNome.value.trim(); if(!nome){return}
  const dados={nome,funcao:nfFuncao.value||'-',cpf:nfCpf.value||'-',pix:nfPix.value||'',banco:nfBanco.value||'',tel:nfTel.value||'',endereco:nfEndereco.value||''};
  if(editandoFId){ {const fx=funcionarios.find(x=>x.id===editandoFId);Object.assign(fx,dados);persistir('funcionarios',fx);} editandoFId=null; }
  else { dados.ativo=true; dados.id='F'+String(funcionarios.length+1).padStart(3,'0'); funcionarios.push(dados); persistir('funcionarios',dados); }
  document.getElementById('formNovoF').style.display='none';
  render(); filtroF('');
}
function filtroF(q){
  q=q.toLowerCase();
  const list=funcionarios.filter(f=>f.nome.toLowerCase().includes(q)||f.cpf.includes(q)||f.id.toLowerCase().includes(q));
  document.getElementById('tbF').innerHTML=list.map(f=>

function toggleFuncionario(id){
  const f=funcionarios.find(x=>x.id===id), desativar=f.ativo!==false;
  if(desativar&&!confirm('Registrar desligamento de '+f.nome+'? Ele deixa de aparecer nos novos lançamentos, mas o histórico continua.'))return;
  f.ativo=!desativar; f.desligadoEm=desativar?hoje():null; persistir('funcionarios',f); filtroF('');
}
function totaisPorFuncionario(fid,mes=0){
  let tot={cafe:0,almoco:0,lanche:0,janta:0,passagem:0,combustivel:0,estac:0,hosp:0,diaria:0};
  vivos(lancamentos).forEach(l=>{
    if(l.colabs.includes(fid)&&noPeriodo(l.data,mes)){
      const n=l.colabs.length;
      tot.cafe+=l.alim.cafe/n; tot.almoco+=l.alim.almoco/n; tot.lanche+=l.alim.lanche/n; tot.janta+=l.alim.janta/n;
      tot.passagem+=l.log.passagem/n; tot.combustivel+=l.log.combustivel/n; tot.estac+=l.log.estac/n; tot.hosp+=l.log.hosp/n;
      tot.diaria+=(l.diaria[fid]||0);
    }
  });
  return tot;
}
function abrirF(fid,mes){
  if(mes===undefined)mes=new Date().getMonth()+1;
  const f=funcionarios.find(x=>x.id===fid);
  const t=totaisPorFuncionario(fid,mes);
  const total=Object.values(t).reduce((a,b)=>a+b,0);
  document.getElementById('relF').innerHTML=`
   <div class="card">
    <h2>${f.nome} <span class="tag">${f.id}</span></h2>
    <div class="row"><div><label>Relatório</label>
      <select id="periodoF" onchange="abrirF('${fid}',parseInt(this.value))">${opcoesMes(mes)}</select>
    </div></div>
    <div class="section-title">Totais no período</div>
    <table><tr><td>Alimentação</td><td>R$ ${(t.cafe+t.almoco+t.lanche+t.janta).toFixed(2)}</td></tr>
    <tr><td>Logística</td><td>R$ ${(t.passagem+t.combustivel+t.estac+t.hosp).toFixed(2)}</td></tr>
    <tr><td>Diária</td><td>R$ ${t.diaria.toFixed(2)}</td></tr>
    <tr><td><b>Total</b></td><td><b>R$ ${total.toFixed(2)}</b></td></tr></table>
    <button class="btn" onclick="gerarRecibo('${fid}',['diaria','alim','log'],${mes})">Gerar recibo (PDF)</button>
   </div>`;
}

   tel:r.querySelector('.rTel').value, email:r.querySelector('.rEmail').value})).filter(r=>r.nome);
  const base={nome,endereco:noEndereco.value||'',cnpj:noCnpj.value||'',segmento:noSeg.value,
   descricaoServico:noDesc.value||'',numOS:noOS.value||'',numContrato:noContrato.value||'',
   responsaveis,tipo:noTipo.value,valor:noTipo.value==='Fechada'?num(noValor.value):null};

  if(noSeg.value==='Maritimo') Object.assign(base,{embarcacao:noEmbarcacao.value||'',imo:noImo.value||'',localizacaoAtual:noLocal.value||''});

   if(o.tipo==='Fechada'){const pago=(o.pagamentos||[]).reduce((s,p)=>s+p.valor,0);

}

function acharItem(colecao,id){return ({lancamentos:lancamentos,gastos:gastosIndiretos,faturamentos:faturamentos})[colecao].find(i=>i.id===id)}
function cancelarItem(colecao,id){

  ['cafe','almoco','lanche','janta'].forEach(k=>document.getElementById(k).value=(l.alim||{})[k]||'');
  ['passagem','combustivel','estac','hosp'].forEach(k=>document.getElementById(k).value=(l.log||{})[k]||'');
  btnSalvarL.textContent='Salvar correção'; btnCancelaEdL.style.display='inline-block';
  document.getElementById('msgL').textContent='Corrigindo o lançamento de '+dataBR(l.data)+'. Altere o que precisar e toque em "Salvar correção".';
  window.scrollTo(0,0);

async function sincronizarRegistrosColaborador(l){
  if(!l?.id)return;
  const existentes=await db.collection('registros_colaborador').where('lancamentoId','==',l.id).get();
  const desejados=new Set((l.colabs||[]).map(fid=>`${l.id}_${fid}`));
  const batch=db.batch();
  existentes.docs.forEach(d=>{if(!desejados.has(d.id))batch.delete(d.ref)});
  (l.colabs||[]).forEach(fid=>{
    const ref=db.collection('registros_colaborador').doc(`${l.id}_${fid}`);
    batch.set(ref,{lancamentoId:l.id,funcionarioId:fid,data:l.data,obra:l.obra,obraNome:l.obraNome||nomeO(l.obra),diaria:(l.diaria||{})[fid]||0,cancelado:!!l.cancelado,alteradoEm:new Date().toISOString()});
  });
  await batch.commit();
}
function salvarLancamento(){
  const ids=[...document.querySelectorAll('.cColab:checked')].map(c=>c.value);
  if(!ids.length){document.getElementById('msgL').textContent='Selecione ao menos um colaborador.';return}
  const diaria={}; document.querySelectorAll('.dVal').forEach(i=>diaria[i.dataset.id]=num(i.value));
  const dados={data:lData.value,obra:lObra.value,obraNome:nomeO(lObra.value),modo:lModo.value,colabs:ids,
   alim:{cafe:num(cafe.value),almoco:num(almoco.value),lanche:num(lanche.value),janta:num(janta.value)},
   log:{passagem:num(passagem.value),combustivel:num(combustivel.value),estac:num(estac.value),hosp:num(hosp.value)},diaria};
  let msg;
  if(editandoLancId){
    const l=lancamentos.find(x=>x.id===editandoLancId), antes=JSON.parse(JSON.stringify(l));
    Object.assign(l,dados); persistir('lancamentos',l,'corrigido',antes).then(()=>sincronizarRegistrosColaborador(l)); editandoLancId=null; msg='Lançamento corrigido.';
  } else {
    {const l=lancamentos[lancamentos.push(dados)-1];persistir('lancamentos',l).then(()=>sincronizarRegistrosColaborador(l));}
    msg='Lançamento salvo.'+(dados.modo==='grupo'?` Valores rateados entre ${ids.length} colaborador(es).`:'');
  }
  render(); document.getElementById('msgL').textContent=msg;
}

let editandoEscalaId=null;
function equipeChecks(selecionados=[]){
 return funcionarios.filter(f=>f.ativo!==false||selecionados.includes(f.id)).map(f=>`<label class="chk"><input type="checkbox" class="eColab" value="${f.id}" ${selecionados.includes(f.id)?'checked':''}> ${f.nome}</label>`).join('');
}
function viewEscalas(){
 const lista=escalas.slice().sort((a,b)=>(b.data+b.inicio).localeCompare(a.data+a.inicio));
 return `<div class="card"><h2>${editandoEscalaId?'Editar':'Nova'} escala</h2>
  <div class="row"><div><label>Data</label><input type="date" id="eData" value="${hoje()}"></div><div><label>Obra/Cliente</label><select id="eObra">${obras.filter(o=>o.tipo!=='Administrativo').map(o=>`<option value="${o.id}">${o.nome}</option>`).join('')}</select></div></div>
  <div class="row"><div><label>Início</label><input type="time" id="eInicio"></div><div><label>Fim</label><input type="time" id="eFim"></div></div>
  <label>Serviço / orientação</label><input id="eServico" placeholder="Ex.: instalação de tela / acesso pela portaria principal">
  <label>Equipe prevista</label><div id="eEquipe">${equipeChecks()}</div>
  <button class="btn gold" onclick="salvarEscala()">${editandoEscalaId?'Salvar alteração':'Salvar escala'}</button>${editandoEscalaId?'<button class="btn ghost" onclick="editandoEscalaId=null;render()">Cancelar</button>':''}
  <p class="hint">A escala é planejamento. Ela não gera diária nem pagamento automaticamente.</p></div>
  <div class="card"><h2>Escalas registradas</h2><table><thead><tr><th>Data</th><th>Obra</th><th>Horário</th><th>Equipe</th><th></th></tr></thead><tbody>${lista.map(e=>`<tr style="${e.cancelada?'opacity:.5':''}"><td>${dataBR(e.data)}</td><td>${nomeO(e.obra)}</td><td>${e.inicio||'-'}–${e.fim||'-'}</td><td>${(e.colabs||[]).map(nomeF).join(', ')}</td><td>${e.cancelada?'<span class="tag">CANCELADA</span>':`<button class="btn ghost" style="margin:0;padding:3px 8px" onclick="editarEscala('${e.id}')">editar</button> <button class="btn ghost" style="margin:0;padding:3px 8px" onclick="cancelarEscala('${e.id}')">cancelar</button>`}</td></tr>`).join('')||'<tr><td colspan="5">Nenhuma escala registrada.</td></tr>'}</tbody></table></div>`;
}
function salvarEscala(){
 const colabs=[...document.querySelectorAll('.eColab:checked')].map(x=>x.value); if(!colabs.length)return alert('Selecione ao menos um colaborador.');
 const dados={data:eData.value,obra:eObra.value,obraNome:nomeO(eObra.value),inicio:eInicio.value,fim:eFim.value,servico:eServico.value.trim(),colabs,cancelada:false};
 // Aviso de conflito objetivo, sem bloquear a decisão do gestor.
 const conflitos=escalas.filter(e=>!e.cancelada&&e.id!==editandoEscalaId&&e.data===dados.data&&e.colabs.some(id=>colabs.includes(id))&&(!dados.inicio||!dados.fim||!e.inicio||!e.fim||(dados.inicio<e.fim&&dados.fim>e.inicio)));
 if(conflitos.length&&!confirm('Atenção: há colaborador(es) já escalado(s) nesse período. Deseja salvar mesmo assim?'))return;
 if(editandoEscalaId){const e=escalas.find(x=>x.id===editandoEscalaId),antes=JSON.parse(JSON.stringify(e));Object.assign(e,dados);persistir('escalas',e,'corrigido',antes);editandoEscalaId=null;}
 else {escalas.push(dados);persistir('escalas',dados);}
 render();
}
function editarEscala(id){
 const e=escalas.find(x=>x.id===id); editandoEscalaId=id; render();
 eData.value=e.data;eObra.value=e.obra;eInicio.value=e.inicio||'';eFim.value=e.fim||'';eServico.value=e.servico||'';
 document.getElementById('eEquipe').innerHTML=equipeChecks(e.colabs||[]); window.scrollTo(0,0);
}
function cancelarEscala(id){const e=escalas.find(x=>x.id===id);if(!confirm('Cancelar esta escala? O histórico será preservado.'))return;const antes=JSON.parse(JSON.stringify(e));e.cancelada=true;persistir('escalas',e,'cancelado',antes);render();}
function viewMinhaEscala(){
 const fid=currentUser?.funcionarioId; if(!fid)return '<div class="card"><h2>Minha Escala</h2><p>Seu login ainda não está vinculado ao seu cadastro de funcionário. Procure um administrador.</p></div>';
 const lista=escalas.filter(e=>!e.cancelada&&(e.colabs||[]).includes(fid)).sort((a,b)=>(a.data+a.inicio).localeCompare(b.data+b.inicio));
 return `<div class="card"><h2>Minha Escala</h2><p class="hint">Locais e horários previstos de trabalho. Alterações de escala são feitas pela gestão.</p>${lista.map(e=>`<div class="card"><b>${dataBR(e.data)} · ${e.inicio||'-'}–${e.fim||'-'}</b><br>${e.obraNome||nomeO(e.obra)}${e.servico?`<div class="hint">${e.servico}</div>`:''}</div>`).join('')||'<p>Nenhuma escala registrada para você.</p>'}</div>`;
}
async function carregarMeuHistorico(){
 const box=document.getElementById('meuHistBox'),fid=currentUser?.funcionarioId;if(!box||!fid)return;
 try{const snap=await db.collection('registros_colaborador').where('funcionarioId','==',fid).get();const ls=snap.docs.map(d=>({...d.data(),id:d.id})).filter(l=>!l.cancelado).sort((a,b)=>b.data.localeCompare(a.data));
 box.innerHTML=`<table><thead><tr><th>Data</th><th>Obra</th><th>Diária</th></tr></thead><tbody>${ls.map(l=>`<tr><td>${dataBR(l.data)}</td><td>${l.obraNome||l.obra}</td><td>${brl(l.diaria||0)}</td></tr>`).join('')||'<tr><td colspan="3">Nenhum trabalho realizado registrado.</td></tr>'}</tbody></table>`;}catch(e){box.textContent='Não foi possível carregar seu histórico.';}
}
function viewMeuHistorico(){setTimeout(carregarMeuHistorico,0);return `<div class="card"><h2>Meu Histórico</h2><p class="hint">Serviços efetivamente lançados e valor da sua diária registrada.</p><div id="meuHistBox">Carregando...</div></div>`;}

// ---------- Atendimentos ----------
function viewAtendimentos(){
  const clientes=obras.filter(o=>o.tipo==='Atendimento');
  return `<div class="card"><h2>Clientes por atendimento</h2>
   <p class="hint">Sem valor fixo de obra — clique no cliente para lançar o valor faturado de cada dia de atendimento.</p>
   <table><thead><tr><th>ID</th><th>Nome</th><th>Responsável</th></tr></thead>
   <tbody>${clientes.map(c=>`<tr onclick="abrirAtendimento('${c.id}')"><td>${c.id}</td><td>${c.nome}</td><td>${(c.responsaveis[0]||{}).nome||'-'}</td></tr>`).join('')}</tbody></table>
  </div><div id="painelAtend"></div>`;
}
function abrirAtendimento(oid){
  atendAberto=oid;
  const c=obras.find(o=>o.id===oid);
  const lista=faturamentos.filter(f=>f.obra===oid&&noPeriodo(f.data,atendMes)).sort((a,b)=>a.data.localeCompare(b.data));
  const total=vivos(lista).reduce((s,f)=>s+f.valor,0);
  document.getElementById('painelAtend').innerHTML=`<div class="card">
   <h2>${c.nome} — lançar valor do dia</h2>
   <div class="row"><div><label>Data</label><input type="date" id="fData" value="${hoje()}"></div>
   <div><label>Valor faturado no dia</label><input type="number" id="fValor" placeholder="ex: 2000"></div></div>
   <div class="row"><div><label>Observação (opcional)</label><input id="fObs" placeholder="ex: desconto, material extra"></div></div>
   <button class="btn gold" onclick="salvarFaturamento('${oid}')">Adicionar</button>
   <div class="row" style="margin-top:12px"><div><label>Fechamento de</label><select onchange="atendMes=parseInt(this.value);abrirAtendimento('${oid}')">${opcoesMes(atendMes)}</select></div></div>
   <table style="margin-top:6px"><thead><tr><th>Data</th><th>Valor</th><th>Obs.</th><th></th></tr></thead>
   <tbody>${lista.map(f=>`<tr style="${f.cancelado?'opacity:.5':''}"><td>${dataBR(f.data)}</td><td>${brl(f.valor)}</td><td>${f.obs||''}</td><td>${botoesItem('faturamentos',f,'corrigirFaturamento')}</td></tr>`).join('')}
   <tr><td><b>TOTAL DO FECHAMENTO (${periodoLabel(atendMes)})</b></td><td><b>${brl(total)}</b></td><td></td><td></td></tr></tbody></table>
  </div>`;
}
function salvarFaturamento(oid){
  const v=num(document.getElementById('fValor').value); if(!v)return;
  persistir('faturamentos',faturamentos[faturamentos.push({obra:oid,data:document.getElementById('fData').value,valor:v,obs:document.getElementById('fObs').value||''})-1]);
  abrirAtendimento(oid);
}
function corrigirFaturamento(id){
  const f=faturamentos.find(x=>x.id===id);
  const d=prompt('Data (AAAA-MM-DD):',f.data); if(d===null)return;
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d.trim()))return alert('Data inválida. Use o formato AAAA-MM-DD.');
  const nv=prompt('Novo valor do dia (R$):',f.valor); if(nv===null)return;
  const v=parseFloat(String(nv).replace(',','.')); if(!(v>=0))return alert('Valor inválido.');
  const obs=prompt('Observação (ex.: desconto, material extra):',f.obs||''); if(obs===null)return;
  const antes=JSON.parse(JSON.stringify(f)); f.data=d.trim(); f.valor=v; f.obs=obs; persistir('faturamentos',f,'corrigido',antes); atualizarTela();
}

// ---------- Gastos Indiretos ----------
function viewGastos(){
  const listaAno=gastosIndiretos.map((g,i)=>({g,i})).filter(x=>x.g.data.startsWith(String(anoAtual)));
  const total=vivos(listaAno.map(x=>x.g)).reduce((s,g)=>s+g.valorTotal,0);
  return `<div class="card">
   <h2>Gastos diretos/indiretos da obra</h2>
   <p class="hint">Material, impostos, notas, visitas técnicas, cursos/treinamentos/ASO — entram no custo da obra ou do Administrativo, não no pagamento de colaborador. Pode ser atualizado a cada parcela paga.</p>
   <div class="row"><div><label>Data</label><input type="date" id="gData" value="${hoje()}"></div>
   <div><label>Categoria</label><select id="gCat">${categoriasGasto.map(c=>`<option>${c}</option>`).join('')}</select></div></div>
   <div class="row"><div><label>Descrição</label><input id="gDesc"></div>
   <div><label>Obra ou Administrativo</label><select id="gObra">${obras.map(o=>`<option value="${o.id}">${o.nome}</option>`).join('')}</select></div></div>
   <div class="row"><div><label>Valor total</label><input id="gValor" type="number"></div></div>
   <button class="btn gold" id="btnSalvarG" onclick="salvarGasto()">Salvar gasto</button>
   <button class="btn ghost" id="btnCancelaEdG" style="display:none" onclick="editandoGastoId=null;render()">Cancelar edição</button>
   <p class="hint" id="msgG"></p>
  </div>
  <div class="card"><h2>Lançamentos de gastos — ${anoAtual}</h2>
   <table><thead><tr><th>Data</th><th>Categoria</th><th>Descrição</th><th>Obra</th><th>Total</th><th>Pago</th><th>Saldo</th><th>Status</th><th></th></tr></thead>
   <tbody>${listaAno.map(({g,i})=>{const s=statusGasto(g);const parc=`<button class="btn ghost" style="margin:0 2px 2px 0;padding:3px 8px" onclick="registrarPagamentoGasto(${i})">+ parcela</button>`;
    return `<tr style="${g.cancelado?'opacity:.5':''}"><td>${dataBR(g.data)}</td><td>${g.categoria}</td><td>${g.desc}</td><td>${nomeO(g.obra)}</td><td>${brl(g.valorTotal)}</td><td>${brl(s.pago)}</td><td>${brl(s.saldo)}</td><td><span class="tag">${s.label}</span></td><td>${botoesItem('gastos',g,'corrigirGasto',parc)}</td></tr>`}).join('')}
   <tr><td colspan="4"><b>TOTAL</b></td><td colspan="5"><b>${brl(total)}</b></td></tr></tbody></table>
  </div>`;
}
function corrigirGasto(id){
  const g=gastosIndiretos.find(x=>x.id===id); editandoGastoId=id;
  gData.value=g.data; gCat.value=g.categoria; gDesc.value=g.desc; gObra.value=g.obra; gValor.value=g.valorTotal;
  btnSalvarG.textContent='Salvar correção'; btnCancelaEdG.style.display='inline-block';
  document.getElementById('msgG').textContent='Corrigindo o gasto "'+g.desc+'". As parcelas já pagas continuam registradas.';
  window.scrollTo(0,0);
}
function salvarGasto(){
  const desc=gDesc.value.trim(); if(!desc){return}
  const dados={data:gData.value,categoria:gCat.value,desc,obra:gObra.value,valorTotal:num(gValor.value)};
  if(editandoGastoId){
    const g=gastosIndiretos.find(x=>x.id===editandoGastoId), antes=JSON.parse(JSON.stringify(g));
    const pago=(g.pagamentos||[]).reduce((s,p)=>s+num(p.valor),0);
    if(dados.valorTotal<pago){document.getElementById('msgG').textContent='O valor total não pode ser inferior a '+brl(pago)+', pois esse valor já foi registrado como pago.';return}
    Object.assign(g,dados); persistir('gastos',g,'corrigido',antes); editandoGastoId=null;
  } else persistir('gastos',gastosIndiretos[gastosIndiretos.push({...dados,pagamentos:[]})-1]);
  render();
}

// ---------- Usuários (master) ----------
function viewUsuarios(){
  if(!currentUser?.gerenciarUsuarios)return '<div class="card"><h2>Acesso restrito</h2></div>';
  setTimeout(carregarUsuarios,0);
  return `<div class="card"><h2>Usuários do sistema</h2>
   <p class="hint">1) Crie o login em Firebase Console → Authentication → Add user (e-mail/senha). 2) Copie o UID gerado e registre aqui com o papel da pessoa.</p>
   <div class="row"><div><label>UID (do Firebase Authentication)</label><input id="nuUid"></div>
   <div><label>Nome</label><input id="nuNome"></div></div>
   <div class="row"><div><label>Papel</label><select id="nuRole"><option value="colaborador">Colaborador</option><option value="gestor">Gestor</option><option value="master">Master/Sócio</option></select></div></div>
   <div><label>Funcionário vinculado (qualquer papel, quando também atuar como colaborador)</label><select id="nuFuncionario"><option value="">-- nenhum --</option>${funcionarios.filter(f=>f.ativo!==false).map(f=>`<option value="${f.id}">${f.nome}</option>`).join('')}</select></div><button class="btn gold" onclick="salvarUsuario()">Registrar usuário</button>
  </div>
  <div class="card"><h2>Usuários cadastrados</h2><table id="tbUsuarios"><tr><td>Carregando...</td></tr></table></div>`;
}
async function carregarUsuarios(){
  const snap=await db.collection('usuarios').get();
  const tb=document.getElementById('tbUsuarios'); if(!tb)return;
  tb.innerHTML='<tr><th>ID</th><th>Nome</th><th>Papel</th><th>Status</th><th></th></tr>'+
   snap.docs.map(d=>{const u=d.data();return `<tr><td>${d.id.slice(0,6)}</td><td>${u.nome}</td><td>${u.role}</td><td><span class="tag">${u.ativo===false?'DESATIVADO':'ATIVO'}</span></td><td><button class="btn ghost" style="margin:0 2px 2px 0;padding:3px 8px" onclick="editarPapelUsuario('${d.id}','${u.role||'colaborador'}')">papel</button><button class="btn ghost" style="margin:0 2px 2px 0;padding:3px 8px" onclick="editarVinculoUsuario('${d.id}','${u.funcionarioId||''}')">vínculo</button><button class="btn ghost" style="margin:0;padding:3px 8px" onclick="toggleUsuario('${d.id}',${u.ativo===false})">${u.ativo===false?'reativar':'desativar'}</button></td></tr>`}).join('');
}

function editarPapelUsuario(uid,atual){
  if(!currentUser?.gerenciarUsuarios)return;
  const mapa={colaborador:'Colaborador',gestor:'Gestor',master:'Master/Sócio',comum:'Colaborador'};
  const novo=(prompt('Novo papel: colaborador, gestor ou master',atual==='comum'?'colaborador':atual)||'').trim().toLowerCase();
  if(!['colaborador','gestor','master'].includes(novo))return alert('Papel inválido.');
  const upd={role:novo};
  db.collection('usuarios').doc(uid).update(upd).then(carregarUsuarios);
}
function salvarUsuario(){
  const uid=nuUid.value.trim(); if(!uid)return;
  db.collection('usuarios').doc(uid).set({nome:nuNome.value||'-',role:nuRole.value,ativo:true,funcionarioId:nuFuncionario.value||null}).then(carregarUsuarios);
}
function editarVinculoUsuario(uid,atual){
  if(!currentUser?.gerenciarUsuarios)return;
  const opcoes=funcionarios.filter(f=>f.ativo!==false).map(f=>`${f.id} = ${f.nome}`).join('\n');
  const novo=prompt('Funcionário vinculado. Informe o ID do funcionário ou deixe em branco para remover o vínculo:\n\n'+opcoes,atual||'');
  if(novo===null)return;
  const fid=novo.trim();
  if(fid&&!funcionarios.some(f=>f.id===fid))return alert('ID de funcionário inválido.');
  db.collection('usuarios').doc(uid).update({funcionarioId:fid||null}).then(()=>{carregarUsuarios();alert(fid?'Vínculo atualizado. O usuário deve sair e entrar novamente para carregar as abas pessoais.':'Vínculo removido.');});
}
function toggleUsuario(uid,ativar){
  db.collection('usuarios').doc(uid).update({ativo:ativar}).then(carregarUsuarios);
}

function catsSelecionadas(){

}

const ITENS={cafe:['Café da manhã','alim'],almoco:['Almoço','alim'],lanche:['Lanche','alim'],janta:['Janta','alim'],passagem:['Passagem','log'],combustivel:['Combustível','log'],estac:['Estacionamento','log'],hosp:['Hospedagem','log']};
function detalheFuncionario(fid,mes){
  const it={}; Object.keys(ITENS).concat('diaria').forEach(k=>it[k]={valor:0,dias:new Set()});
  vivos(lancamentos).forEach(l=>{
    if(!l.colabs.includes(fid)||!noPeriodo(l.data,mes))return;
    const n=l.colabs.length;
    Object.keys(ITENS).forEach(k=>{const v=((l[ITENS[k][1]]||{})[k]||0)/n; if(v>0){it[k].valor+=v;it[k].dias.add(l.data)}});
    const d=(l.diaria||{})[fid]||0; if(d>0){it.diaria.valor+=d;it.diaria.dias.add(l.data)}
  });
  return it;
}

  return `<div style="display:flex;justify-content:space-between;align-items:flex-start">
   <img src="${LOGO_SAFETY}" style="height:24mm">
   <div style="text-align:right"><div style="font-weight:bold;font-size:12pt;color:#0b2a4a">SAFETY EQUIPAMENTOS</div>
   <div style="font-size:7.5pt;color:#6b7280;line-height:1.4">atendimento@safetyequipamentos.com | (21) 2756-5524 | WhatsApp (21) 99532-0709<br>www.safetyequipamentos.com | CNPJ 22.015.773/0001-84</div></div></div>
   <div style="display:flex;height:6mm;margin:3mm 0 4mm"><div style="flex:46;background:#0f4c9c"></div><div style="flex:54;background:#d4a72c"></div></div>`;
}
function docRodape(cod){
  return `<div style="height:5mm;background:#0b2a4a;margin-top:4mm"></div>
   <div style="display:flex;justify-content:space-between;font-size:7pt;color:#6b7280;margin-top:1mm">
   <span style="width:40%">Rua José de Queiroz, 196 - Bento Ribeiro - Rio de Janeiro/RJ</span><b>${cod} | REV. 00</b><span style="width:20%"></span></div>`;
}
function docTitulo(titulo,sub,ref){
  const resp=currentUser?`${currentUser.nome} (ID ${currentUser.uid.slice(0,6)})`:'-';
  const cel=(a,b)=>`<div style="flex:1"><div style="font-size:7pt;font-weight:bold;color:#d4a72c">${a}</div><div style="font-size:9pt;font-weight:bold">${b}</div></div>`;
  return `<div style="font-size:8pt;font-weight:bold;color:#d4a72c">FINANCEIRO</div>
   <div style="font-size:20pt;font-weight:bold;color:#0b2a4a;border-bottom:1.5px solid #0f4c9c;padding-bottom:2mm">${titulo}</div>
   <div style="font-size:10pt;color:#6b7280;margin:2mm 0 3mm">${sub}</div>
   <div style="display:flex;background:#eef3fa;padding:3mm 4mm;gap:6mm">${cel('DATA',new Date().toLocaleDateString('pt-BR'))}${cel('REFERÊNCIA',ref)}${cel('RESPONSÁVEL',resp)}</div>`;
}
function imprimirDoc(titulo,sub,ref,corpo,cod,arquivo){
  const pa=document.getElementById('printArea');
  pa.innerHTML=`<table class="pg"><thead><tr><td>${docCabecalho()}</td></tr></thead>
   <tbody><tr><td>${docTitulo(titulo,sub,ref)}${corpo}</td></tr></tbody>
   <tfoot><tr><td>${docRodape(cod)}</td></tr></tfoot></table>`;
  const t=document.title; document.title=arquivo;
  window.onafterprint=()=>{document.title=t;pa.innerHTML=''};
  window.print();
}
function gerarRecibo(fid,cats,mes=0){
  const f=funcionarios.find(x=>x.id===fid), it=detalheFuncionario(fid,mes);
  if(!f.banco||!f.pix){if(!confirm('Este colaborador está sem banco ou PIX cadastrado. Gerar o recibo mesmo assim?'))return}
  let rows='',total=0;
  const dia=n=>n+(n===1?' dia':' dias');
  const linha=(nome,x,ref)=>{rows+=`<tr><td>${nome}</td><td>${ref}</td><td class="r">${brl(x.valor)}</td></tr>`;total+=x.valor};
  if(cats.includes('diaria')&&it.diaria.valor>0){const n=it.diaria.dias.size;linha('<b>Diária</b>',it.diaria,`<b>${n} ${n===1?'diária':'diárias'}</b>`)}
  [['alim','Alimentação'],['log','Logística']].forEach(([g,nome])=>{
    if(!cats.includes(g))return;
    const ks=Object.keys(ITENS).filter(k=>ITENS[k][1]===g&&it[k].valor>0);
    if(!ks.length)return;
    rows+=`<tr class="grp"><td colspan="3">${nome}</td></tr>`;
    ks.forEach(k=>linha(ITENS[k][0],it[k],dia(it[k].dias.size)));
  });
  if(total<=0){alert('Não há valores lançados para este colaborador no período.');return}
  rows+=`<tr class="tot"><td>TOTAL</td><td></td><td class="r">${brl(total)}</td></tr>`;
  const mm=String(mes||0).padStart(2,'0');
  const corpo=`<div style="margin:4mm 0 2mm;font-size:9.5pt">Colaborador: <b>${f.nome}</b> · CPF ${f.cpf} · Função: ${f.funcao}</div>
   <table class="tb"><thead><tr><th>Descrição</th><th>Referência</th><th class="r">Valor</th></tr></thead><tbody>${rows}</tbody></table>
   <p style="font-size:9.5pt;margin-top:6mm">Declaro ter recebido os valores citados acima em minha conta no banco <b>${f.banco||'[não cadastrado]'}</b> pelo PIX <b>${f.pix||'[não cadastrado]'}</b>.</p>
   <div style="margin-top:22mm;text-align:center;font-size:9.5pt"><div style="border-top:1px solid #333;width:80mm;margin:0 auto 1mm"></div><b>${f.nome}</b><br>CPF ${f.cpf}</div>`;
  imprimirDoc('RECIBO DE PAGAMENTO',periodoLabel(mes),`${f.id} · ${mes?mm+'/':''}${anoAtual}`,corpo,'SE-MOD-ADM-098',`Recibo_${f.nome.split(' ')[0]}_${anoAtual}${mes?'-'+mm:''}`);
}
function gerarAuditoria(){
  const mes=parseInt(document.getElementById('rMes').value), tipo=document.getElementById('rTipo').value;
  const mm=String(mes||0).padStart(2,'0'), ref=`AUD · ${mes?mm+'/':''}${anoAtual}`;
  const arq=`Auditoria_${tipo}_${anoAtual}${mes?'-'+mm:''}`;
  if(tipo==='presenca'){
    const mapa={};
    vivos(lancamentos).forEach(l=>{if(!noPeriodo(l.data,mes))return;
      l.colabs.forEach(c=>{const m=mapa[c]=mapa[c]||{dias:new Set(),obras:{}};m.dias.add(l.data);(m.obras[l.obra]=m.obras[l.obra]||new Set()).add(l.data)})});
    const ids=Object.keys(mapa).sort((a,b)=>nomeF(a).localeCompare(nomeF(b)));
    if(!ids.length){alert('Nenhum colaborador com lançamento no período.');return}
    const rows=ids.map(id=>{const m=mapa[id];
      const obras=Object.keys(m.obras).map(o=>`${nomeO(o)} (${m.obras[o].size})`).join(' · ');
      const datas=[...m.dias].sort().map(d=>mes?d.slice(8,10):dataBR(d)).join(', ');
      return `<tr><td>${nomeF(id)}</td><td class="r">${m.dias.size}</td><td>${obras}</td><td>${datas}</td></tr>`}).join('');
    const corpo=`<table class="tb" style="margin-top:5mm"><thead><tr><th>Colaborador</th><th class="r">Dias</th><th>Obras/Clientes (dias)</th><th>Datas</th></tr></thead><tbody>${rows}
     <tr class="tot"><td>TOTAL</td><td></td><td>${ids.length} colaborador${ids.length===1?'':'es'}</td><td></td></tr></tbody></table>`;
    imprimirDoc('RELATÓRIO DE AUDITORIA · PRESENÇA',`${periodoLabel(mes)} · Somente colaboradores que trabalharam no período`,ref,corpo,'SE-MOD-ADM-099',arq);
    return;
  }
  const linhas=[];
  vivos(lancamentos).forEach(l=>{if(!noPeriodo(l.data,mes))return;
    const n=l.colabs.length, sa=Object.values(l.alim||{}).reduce((a,b)=>a+b,0)/n, sl=Object.values(l.log||{}).reduce((a,b)=>a+b,0)/n;
    l.colabs.forEach(c=>linhas.push({data:l.data,obra:l.obra,colab:nomeF(c)+(l.modo==='grupo'&&(sa+sl)>0?' (rateio)':''),a:sa,l:sl,d:(l.diaria||{})[c]||0}))});
  linhas.sort((x,y)=>nomeO(x.obra).localeCompare(nomeO(y.obra))||x.data.localeCompare(y.data));
  let rows='',ta=0,tl=0,td=0,sub=null;
  const fechaSub=()=>{if(sub)rows+=`<tr class="sub"><td></td><td colspan="2">Subtotal ${nomeO(sub.obra)}</td><td class="r">${brl(sub.a)}</td><td class="r">${brl(sub.l)}</td><td class="r">${brl(sub.d)}</td><td class="r"><b>${brl(sub.a+sub.l+sub.d)}</b></td></tr>`};
  linhas.forEach(x=>{
    if(!sub||sub.obra!==x.obra){fechaSub();sub={obra:x.obra,a:0,l:0,d:0}}
    sub.a+=x.a;sub.l+=x.l;sub.d+=x.d;ta+=x.a;tl+=x.l;td+=x.d;
    rows+=`<tr><td>${dataBR(x.data)}</td><td>${nomeO(x.obra)}</td><td>${x.colab}</td><td class="r">${brl(x.a)}</td><td class="r">${brl(x.l)}</td><td class="r">${brl(x.d)}</td><td class="r">${brl(x.a+x.l+x.d)}</td></tr>`});
  fechaSub();
  if(!linhas.length)rows='<tr><td colspan="7">Sem lançamentos no período.</td></tr>';
  else rows+=`<tr class="tot"><td colspan="3">TOTAL GERAL</td><td class="r">${brl(ta)}</td><td class="r">${brl(tl)}</td><td class="r">${brl(td)}</td><td class="r">${brl(ta+tl+td)}</td></tr>`;
  const h='font-weight:bold;color:#0f4c9c;margin-top:5mm;font-size:10pt';
  let corpo=`<div style="${h}">1. Lançamentos por dia</div>
   <table class="tb"><thead><tr><th>Data</th><th>Obra/Cliente</th><th>Colaborador</th><th class="r">Alim.</th><th class="r">Logíst.</th><th class="r">Diária</th><th class="r">Total</th></tr></thead><tbody>${rows}</tbody></table>
   <p style="font-size:7.5pt;color:#6b7280;margin:0">Valores de compra em grupo aparecem já rateados e marcados com (rateio).</p>`;
  const gs=vivos(gastosIndiretos).filter(g=>noPeriodo(g.data,mes)).sort((x,y)=>x.data.localeCompare(y.data));
  if(gs.length){
    let gt=0,gp=0;
    const gr=gs.map(g=>{const s=statusGasto(g);gt+=g.valorTotal;gp+=s.pago;
      return `<tr><td>${dataBR(g.data)}</td><td>${g.categoria}</td><td>${g.desc}</td><td>${nomeO(g.obra)}</td><td class="r">${brl(g.valorTotal)}</td><td class="r">${brl(s.pago)}</td><td class="r">${brl(s.saldo)}</td></tr>`}).join('');
    corpo+=`<div style="${h}">2. Gastos diretos e indiretos</div>
     <table class="tb"><thead><tr><th>Data</th><th>Categoria</th><th>Descrição</th><th>Obra</th><th class="r">Total</th><th class="r">Pago</th><th class="r">Saldo</th></tr></thead><tbody>${gr}
     <tr class="tot"><td colspan="4">TOTAL</td><td class="r">${brl(gt)}</td><td class="r">${brl(gp)}</td><td class="r">${brl(gt-gp)}</td></tr></tbody></table>`;
  }
  imprimirDoc('RELATÓRIO DE AUDITORIA',`${periodoLabel(mes)} · Todas as obras`,ref,corpo,'SE-MOD-ADM-099',arq);
}

// ---------- Dashboard ----------
let dashboardMes=0;
function receitasObra(oid,mes=0){
  const o=obras.find(x=>x.id===oid); if(!o)return 0;
  if(o.tipo==='Atendimento')return vivos(faturamentos).filter(f=>f.obra===oid&&noPeriodo(f.data,mes)).reduce((s,f)=>s+num(f.valor),0);
  return (o.pagamentos||[]).filter(p=>noPeriodo(p.data,mes)).reduce((s,p)=>s+num(p.valor),0);
}
function custosObra(oid,mes=0){
  const l=vivos(lancamentos).filter(x=>x.obra===oid&&noPeriodo(x.data,mes)).reduce((s,x)=>s+totalLanc(x),0);
  const g=vivos(gastosIndiretos).filter(x=>x.obra===oid&&noPeriodo(x.data,mes)).reduce((s,x)=>s+num(x.valorTotal),0);
  return l+g;
}
function dadosDashboardMes(mes){
  const receita=obras.filter(o=>o.tipo!=='Administrativo').reduce((s,o)=>s+receitasObra(o.id,mes),0);
  const custosObras=obras.filter(o=>o.tipo!=='Administrativo').reduce((s,o)=>s+custosObra(o.id,mes),0);
  const adm=obras.find(o=>o.tipo==='Administrativo'||o.id==='ADM');
  const administrativo=adm?custosObra(adm.id,mes):0;
  return {receita,custosObras,administrativo,resultado:receita-custosObras-administrativo};
}
function viewDashboard(){
  const d=dadosDashboardMes(dashboardMes), adm=obras.find(o=>o.tipo==='Administrativo'||o.id==='ADM');
  const rows=obras.filter(o=>o.tipo!=='Administrativo').map(o=>{const faturado=receitasObra(o.id,dashboardMes),custo=custosObra(o.id,dashboardMes),resultado=faturado-custo,margem=faturado?resultado/faturado*100:null;return {nome:o.nome,faturado,custo,resultado,margem}});
  if(adm){const custo=custosObra(adm.id,dashboardMes);if(custo||dashboardMes===0)rows.push({nome:'ADMINISTRATIVO',faturado:0,custo,resultado:-custo,margem:null,adm:true});}
  setTimeout(desenharGraficoDashboard,0);
  return `<div class="card"><h2>Dashboard — ${periodoLabel(dashboardMes)}</h2>
   <p class="hint">Visão gerencial de receitas, custos e resultado operacional. Não representa saldo bancário nem demonstração contábil.</p>
   <div class="row"><div><label>Período</label><select onchange="dashboardMes=parseInt(this.value);render()">${opcoesMes(dashboardMes)}</select></div></div>
   <div class="kpis"><div class="kpi"><div class="l">Faturamento</div><div class="v">${brl(d.receita)}</div></div><div class="kpi"><div class="l">Custos das obras</div><div class="v">${brl(d.custosObras)}</div></div><div class="kpi"><div class="l">Gastos administrativos</div><div class="v">${brl(d.administrativo)}</div></div><div class="kpi"><div class="l">Resultado</div><div class="v">${brl(d.resultado)}</div></div></div>
   <div class="table-wrap"><table><thead><tr><th>Obra/Cliente</th><th>Faturado</th><th>Custo</th><th>Resultado</th><th>Margem</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${r.nome}</td><td>${r.adm?'—':brl(r.faturado)}</td><td>${brl(r.custo)}</td><td>${brl(r.resultado)}</td><td>${r.margem===null?'—':r.margem.toLocaleString('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:1})+'%'}</td></tr>`).join('')||'<tr><td colspan="5">Sem movimentação no período.</td></tr>'}</tbody></table></div>
   <div class="section-title">Evolução mensal</div><div class="chartBox"><canvas id="dashChart"></canvas></div>
  </div>`;
}
function desenharGraficoDashboard(){
  const c=document.getElementById('dashChart');if(!c)return;const rect=c.getBoundingClientRect(),dpr=window.devicePixelRatio||1;c.width=Math.max(300,rect.width*dpr);c.height=Math.max(220,rect.height*dpr);const x=c.getContext('2d');x.scale(dpr,dpr);const w=rect.width,h=rect.height,p={l:48,r:12,t:18,b:38};
  const vals=Array.from({length:12},(_,i)=>dadosDashboardMes(i+1)),max=Math.max(1,...vals.flatMap(v=>[v.receita,v.custosObras+v.administrativo,Math.abs(v.resultado)]));
  x.font='10px Arial';x.fillStyle='#6b7280';x.strokeStyle='#e2e6ee';x.lineWidth=1;
  for(let i=0;i<=4;i++){const y=p.t+(h-p.t-p.b)*i/4;x.beginPath();x.moveTo(p.l,y);x.lineTo(w-p.r,y);x.stroke();const val=max*(1-i/4);x.fillText(val.toLocaleString('pt-BR',{maximumFractionDigits:0}),2,y+3)}
  const gw=(w-p.l-p.r)/12,bw=Math.max(3,gw*.2);vals.forEach((v,i)=>{const cx=p.l+gw*i+gw/2;const bar=(val,off,color)=>{const bh=(h-p.t-p.b)*val/max;x.fillStyle=color;x.fillRect(cx+off-bw/2,h-p.b-bh,bw,bh)};bar(v.receita,-bw,'#0f4c9c');bar(v.custosObras+v.administrativo,0,'#d4a72c');bar(Math.max(0,v.resultado),bw,'#1b2f5e');x.fillStyle='#6b7280';x.fillText(String(i+1).padStart(2,'0'),cx-6,h-18)});
  x.fillStyle='#0f4c9c';x.fillRect(p.l,h-8,10,5);x.fillStyle='#6b7280';x.fillText('Faturamento',p.l+14,h-3);x.fillStyle='#d4a72c';x.fillRect(p.l+90,h-8,10,5);x.fillStyle='#6b7280';x.fillText('Gastos',p.l+104,h-3);x.fillStyle='#1b2f5e';x.fillRect(p.l+155,h-8,10,5);x.fillStyle='#6b7280';x.fillText('Resultado positivo',p.l+169,h-3);
}

renderNav();render();
</script>
